name: Generate Metrics Dashboard

on:
  # schedule:
  #   - cron: "0 3 * * *"   # runs daily at 3 AM UTC
  # workflow_dispatch:        # allows manual trigger from the Actions tab
  # push:
  #   branches:
  #     - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: github-metrics.svg
          committer_token: ${{ secrets.GITHUB_TOKEN }}

          # --- Base metrics ---
          base: header, activity, community, repositories, metadata

          # --- Plugins (feel free to trim any of these) ---
          plugin_languages: yes
          plugin_languages_analysis_timeout: 45
          plugin_languages_categories: markup, programming
          plugin_languages_recent_categories: markup, programming
          plugin_languages_recent_days: 14

          # NOTE: plugin_habits and plugin_achievements are disabled below.
          # Both are known to be fragile on lowlighter/metrics — achievements
          # scrapes GitHub's UI (breaks whenever GitHub changes page markup)
          # and habits frequently times out. Re-enable individually later by
          # setting to "yes" if you want to try them again.
          plugin_habits: no

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          plugin_achievements: no
